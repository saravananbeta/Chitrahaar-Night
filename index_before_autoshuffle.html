<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chitrahaar Night</title>
  
  <!-- Cursive Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background-color: transparent;
      color: #fff;
    }

    body {
      background-color: #000;
      font-family: sans-serif;
    }

    /* Fullscreen Background Image */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      object-fit: cover !important;
      object-position: top center;
      z-index: 1;
      pointer-events: none;
    }

    /* Cursive Title at Top Left */
    .app-header {
      position: fixed;
      top: 25px;
      left: 35px;
      z-index: 10;
      pointer-events: none;
    }

    .app-header h1 {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-size: 3.4rem;
      font-weight: 400;
      color: #ffb703;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      line-height: 1;
    }

    /* Top Right Container for Clock & Mute Button */
    .top-right-container {
      position: fixed;
      top: 25px;
      right: 35px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    /* Digital Time Display at Top Right */
    .time-display {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* Mute Button below Clock */
    .mute-btn {
      display: none;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .mute-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    /* Centered Container for Sleep Timer above the Player */
    .timer-bar {
      position: fixed;
      bottom: 100px; /* Positions button >20px above player bar */
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Sleep Timer Button Styling */
    #sleepBtn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 0.8rem;
      padding: 6px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    #sleepBtn:hover {
      color: #ffb703;
      border-color: #ffb703;
    }

    /* Sleep Menu Popup Options */
    .timer-container {
      position: relative;
      display: inline-block;
    }

    .sleep-menu {
      display: none;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      flex-direction: column;
      gap: 4px;
      min-width: 110px;
      z-index: 20;
    }

    .sleep-menu.is-open {
      display: flex;
    }

    .sleep-menu button {
      background: transparent;
      border: none;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sleep-menu button:hover {
      background: #ffb703;
      color: #000;
    }

    /* Base Player Bar (Desktop & Laptops) */
    .player-bar {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 28px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transform-origin: bottom center;
    }

    /* Enlarge song title text & container on desktop */
    .track-info {
      max-width: 220px;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* Enlarge volume slider on desktop */
    .volume-container input[type="range"] {
      width: 80px;
    }

    /* Thumbnail inside the player */
    .thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ffb703;
      flex-shrink: 0;
      animation: slowRotate 8s linear infinite;
      animation-play-state: paused;
    }

    .thumb.is-playing {
      animation-play-state: running;
    }   

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .track-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .track-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.68rem;
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 2px;
    }

    .track-input {
      width: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      color: #ffb703;
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      padding: 0 2px;
      transition: all 0.2s ease;
    }

    .track-input:focus {
      border-color: #ffb703;
      background: rgba(0, 0, 0, 0.6);
    }

    .track-input::-webkit-outer-spin-button,
    .track-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .track-input[type=number] {
      -moz-appearance: textfield;
    }
 
    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      outline: none !important;
    }

    .controls button:focus,
    .controls button:active,
    .controls button:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
      outline: none !important;
      box-shadow: none !important;
    }

    @media (hover: hover) and (pointer: fine) {
      .controls button:hover {
        background: #ffb703 !important;
        color: #000000 !important;
      }
    }

    .controls button.is-pressed,
    .controls button.is-active {
      background: #ffb703 !important;
      color: #000000 !important;
    }   

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .volume-container input[type="range"] {
      width: 60px;
      accent-color: #ffb703;
      cursor: pointer;
    }

    #playBtn:not(.is-paused) {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #ffffff !important;
    }

    #playBtn.is-paused {
      background: #ffb703 !important;
      color: #000000 !important;
    }

    .yt-link-text {
      position: fixed;
      bottom: 25px;
      right: 35px;
      z-index: 100;
      color: #ffb703;
      text-decoration: underline;
      font-size: 0.85rem;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      transition: color 0.2s ease;
    }

    .yt-link-text:hover {
      color: #ffffff;
    }

    .audio-engine {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 600px) {
      .bg-image {
        object-fit: cover !important;
        object-position: bottom left !important;
        width: 100vw;
        height: 100vh;
      }

      .app-header {
        top: 15px;
        left: 20px;
      }

      .app-header h1 {
        font-size: 2.2rem;
      }

      .top-right-container {
        top: 20px;
        right: 20px;
      }

      .time-display {
        font-size: 0.85rem;
      }

      .listener-count {
        font-size: 0.8rem;
        font-weight: 500;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
    
      .timer-bar {
        bottom: 95px;
      }

      #sleepBtn {
        font-size: 0.75rem;
        padding: 4px 10px;
      }

      .player-bar {
        bottom: 45px;
        gap: 8px;
        padding: 6px 12px;
        max-width: 95vw;
      }

      .track-info {
        max-width: 100px;
      }

      .volume-container input[type="range"] {
        width: 45px;
      }

      .yt-link-text {
        bottom: 12px;
        right: 50%;
        transform: translateX(50%);
        font-size: 0.75rem;
        white-space: nowrap;
      }
    }  
  </style>
</head>
<body>
 
  <!-- Background Image -->
  <picture>
    <source media="(max-width: 600px)" srcset="chitrahaar-mobile-bg.jpg" />
    <img src="chitrahaar-night-background_Amitabh.jpg" alt="Background" class="bg-image" />
  </picture>

  <!-- Title -->
  <header class="app-header">
    <h1>Chitrahaar Night</h1>
  </header>

  <!-- Time & Mute -->
  <div class="top-right-container">
    <div id="clockDisplay" class="time-display">00:00</div>
    <div id="listenerCount" class="listener-count">Online: --</div>
    <button id="muteBtn" class="mute-btn" aria-label="Toggle Sound">
      <span id="muteIcon">🔇</span>
    </button>
  </div>

  <!-- Sleep Timer Bar -->
  <div class="timer-bar">
    <div class="timer-container">
      <div id="sleepMenu" class="sleep-menu">
        <button onclick="setTimer(30)">30 mins</button>
        <button onclick="setTimer(45)">45 mins</button>
        <button onclick="setTimer(60)">60 mins</button>
        <button onclick="setTimer(0)" style="color: #ff6b6b;">Turn off</button>
      </div>
      <button id="sleepBtn" onclick="toggleSleepMenu()">🌙 Sleep timer</button>
    </div>
  </div>

  <!-- Radio Player -->
  <div class="player-bar">
    <img id="trackThumb" src="" alt="Thumb" class="thumb" />
    
    <div class="track-info">
      <span id="trackTitle" class="track-title" title="Track Title">Loading Title...</span>
      <div class="track-sub">
        <input 
          type="number" 
          id="trackInput" 
          class="track-input" 
          min="1" 
          max="118" 
          value="1" 
          onchange="jumpToTrack(this.value)"
          onkeydown="if(event.key==='Enter') this.blur()"
        />
        <span>/118</span>
      </div>
    </div>

    <div class="controls">
      <!-- <button id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">&#x1F500;&#xFE0E;</button>  -->
      <button onclick="prevTrack(event)" title="Previous">◀◀</button>
      <button id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
      <button onclick="nextTrack(event)" title="Next">▶▶</button>
    </div>

    <div class="volume-container">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
    </div>
  </div>

  <a href="https://www.youtube.com/playlist?list=PLLounUW9rgqGDmPxbZBerszf0dBq_M93b" target="_blank" class="yt-link-text" rel="noopener noreferrer">Listen on YouTube</a>

  <div id="player" class="audio-engine"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').innerText = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const playlist = [
      "KleNYs1Y2I0", "BOLYNw3x1lE", "0AwkZihdw6E", "Lx26NZQleQY", "CkHw1q7blWQ", "UgWCnTwSGTg", "0xnp8z2236w", "YWoXm6V5v-A",
      "nFC7YqKnoKE", "MINo9f1hpz8", "q7iZe8GY8jw", "kf0hRxggFbA", "OJxoJxfSti0", "Zfsmj5zpZ9w", "_9lKgL2ISaY", "3DXeR51OvYg",
      "-f2wNmTi08c", "ScrOw2UfTJQ", "yYWQbyag7SM", "FIj10mJsgQQ", "BzxcAY4c_R4", "m6PmNval9Q8", "k0NnzaKaHOw", "1CDtCROJ3qU",
      "20tQCoNVJTE", "h3yQJZagDTw", "AmQHiMk_Qxw", "zG3hw-xkrow", "7ncsLuDynlk", "iOIuZiBltzU", "ehDDcBzIp5w",
      "Oq6q4HPBc5Q", "CPfiqyl-3_4", "cTvUrpSr9ck", "Y3X8MuobByU", "QCAL-wNyG0A", "MgUi_6UxJFk", "cZH5pnfn1vY", "mhAwMAfmzQQ",
      "ibikPYmtpLw", "ZUdJQSUcK_Y", "xY2P6IAd0MI", "udiDx_OahDo", "PSn9mLj1Z7k", "ilDBlVtupGE", "eQ6SCo2luTs", "9Eg4d56rt-U",
      "tvnXH83qn0Q", "ZK0b6481Bhk", "KgPoWxY1Fis", "rOuYZqomAV0", "RmWX6BYYjD0", "V2JR5qMuTVM", "8BiIHtXZ234", "p4H3YvKs-OU",
      "Mck78aR0wq0", "_SnViWuAU7E", "ZtbHrN8GBhg", "UrApX2yMOnY", "PF-JOx0HIN0", "hxjPGPLoMZQ", "cS6FEpc0z3E", "19-4KLfaLCc",
      "meif1oIfJ5o", "yVImQoGNdTE", "z3MciUpfYao", "ra4qKFmDFVg", "kGDUpxeZZMg", "NWCG3MUDc0A", "PhkADyPektU", "6db52BxXxfQ",
      "uUjeJdaliK4", "f2cUaOLsLQU", "32tNhs2Vk8U", "EBKjZaarSl0", "_SAdpFmk3l4", "3A5xez59mrg", "rHsdArEuHvQ", "Cmpzci-zYFU",
      "YXrqPqDpbjg", "DrAHWIBAiVE", "yXbSZFNBvvE", "YCuhzjK11iA", "zuxaLoz2kLg", "Nqmp8-iD_As", "9dcBy2uXL7E", "dDO9ZRSNB9s",
      "YJWR_MVFigs", "29W5zv1VlJM", "X5XztxGzNko", "qrNbG2W6IRE", "ycouT7JuZhs", "E1XJkGD-eng", "x9O4_C1evRg", "pAv48xBN2IQ",
      "ErmowyGS_YE", "bzTBf-l3RQs", "dodq6nT0k4M", "S-z2NTNqZx4", "QgYf6Z9sVQw", "2FfI2vcFB0g", "ftHwrKS2kYI", "RLYy0csJ5vI",
      "_WQCvtLTsfg", "i5AdRtJNbpM", "DKsmjyMTgBo", "f1Nhozddebo", "Cu2zpXIBWKI", "oYOaMwxlGCM", "VMdpoJoaJ9o", "zQ16T8V-Nsw",
      "F9yWACZWm8s", "Of-V8ADNVdQ", "pW5bH9-t6JE", "D41sf9G1qRk", "2Nh-snz-Llg", "k82SZZaarSl0", "cIBP6cH5AMU"
    ];

    var playlistLength = typeof playlist !== 'undefined' ? playlist.length : 100;
    let isShuffleOn = false;    
    let currentIndex = 0;    
    let ytPlayer;
    let isAudioMuted = true;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '1',
        width: '1',
        videoId: playlist[currentIndex],
        playerVars: { 
          'autoplay': 1,
          'mute': 1,
          'controls': 0,
          'playsinline': 1
        },
        events: {
          'onReady': function(event) {
            event.target.mute();
            event.target.setVolume(90);
            updateMuteUI();
            updateUI();
          },
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }    

    document.addEventListener('click', function unmuteOnFirstClick(e) {
      if (e.target.closest('#muteBtn')) return;
      if (isAudioMuted) {
        isAudioMuted = false;
        if (ytPlayer && typeof ytPlayer.unMute === 'function') {
          ytPlayer.unMute();
          ytPlayer.setVolume(100);
        }
        updateMuteUI();
      }
    }, { once: true });

    document.addEventListener('DOMContentLoaded', function() {
      const muteBtn = document.getElementById('muteBtn');
      if (muteBtn) {
        muteBtn.addEventListener('click', function() {
          isAudioMuted = !isAudioMuted;
          if (ytPlayer && typeof ytPlayer.unMute === 'function') {
            if (isAudioMuted) {
              ytPlayer.mute();
            } else {
              ytPlayer.unMute();
              ytPlayer.setVolume(100);
            }
          }
          updateMuteUI();
        });
      }
    });

    function updateMuteUI() {
      const muteIcon = document.getElementById('muteIcon');
      const muteBtn = document.getElementById('muteBtn');
      if (!muteIcon) return;

      if (isAudioMuted) {
        muteIcon.textContent = '🔇';
        if (muteBtn) muteBtn.classList.add('is-muted');
      } else {
        muteIcon.textContent = '🔊';
        if (muteBtn) muteBtn.classList.remove('is-muted');
      }
    }

    if (window.YT && window.YT.Player) {
      onYouTubeIframeAPIReady();
    }
    
    function updateUI() {
      const id = playlist[currentIndex];
      document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      document.getElementById('trackInput').value = currentIndex + 1;
      fetchTrackTitle();
    }

    function fetchTrackTitle() {
      if (ytPlayer && ytPlayer.getVideoData) {
        const title = ytPlayer.getVideoData().title;
        if (title) {
          document.getElementById('trackTitle').innerText = title;
          document.getElementById('trackTitle').title = title;
          return;
        }
      }
      document.getElementById('trackTitle').innerText = `Track ${currentIndex + 1}`;
    }

    function jumpToTrack(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) return;

      if (num < 1) num = 1;
      if (num > playlist.length) num = playlist.length;

      currentIndex = num - 1;
      renderTrackChange();
    }

    function togglePlay() {
      if (!ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function toggleShuffle() {
      isShuffleOn = !isShuffleOn;
      const btn = document.getElementById('shuffleBtn');
      if (btn) {
        if (isShuffleOn) {
          btn.classList.add('is-active');
        } else {
          btn.classList.remove('is-active');
        }
      }
    }

    function flashButton(btn) {
      if (!btn || !(btn instanceof HTMLElement)) return;
      if (btn._timer) clearTimeout(btn._timer);
      btn.classList.add('is-pressed');
      btn._timer = setTimeout(function() {
        btn.classList.remove('is-pressed');
        btn.blur();
        if (document.activeElement) {
          document.activeElement.blur();
        }
      }, 1000);
    }

    function nextTrack(e) {
      if (e && e.preventDefault) e.preventDefault();
      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);
      currentIndex = (currentIndex + 1) % playlist.length;
      renderTrackChange();
    }

    function prevTrack(e) {
      if (e && e.preventDefault) e.preventDefault();
      const btn = e ? (e.currentTarget || e.target) : null;
      flashButton(btn);
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      renderTrackChange();
    }

    function renderTrackChange() {
      const currentNum = currentIndex + 1;
      const trackElem = document.getElementById('trackInput') 
                     || document.querySelector('.trackInput') 
                     || document.querySelector('[name="trackInput"]');

      if (trackElem) {
        if ('value' in trackElem) {
          trackElem.value = currentNum;
          trackElem.setAttribute('value', currentNum);
        }
        trackElem.textContent = currentNum;
      }

      if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(playlist[currentIndex]);
        updateUI();
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const buttons = document.querySelectorAll('.controls button');
      buttons.forEach(function(btn) {
        btn.addEventListener('touchend', function() {
          setTimeout(() => btn.blur(), 50);
        });
      });
    });

    function setVolume(val) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
    }

    function playNextOrRandom() {
      if (isShuffleOn) {
        let randomIndex = Math.floor(Math.random() * playlist.length);
        if (playlist.length > 1 && randomIndex === currentIndex) {
          randomIndex = (randomIndex + 1) % playlist.length;
        }
        currentIndex = randomIndex;
        renderTrackChange();
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
        renderTrackChange();
      }
    }

    let initialLoad = true;

    function onPlayerStateChange(event) {
      const btn = document.getElementById('playBtn');

      if (initialLoad && event.data === YT.PlayerState.PLAYING) {
        initialLoad = false;
        event.target.pauseVideo();
        event.target.unMute();
        event.target.setVolume(100);
        isAudioMuted = false;
        btn.innerText = '▶';
        btn.classList.add('is-paused');
        updateMuteUI();
        updateUI();
        return;
      }

      if (event.data === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸';
        btn.classList.remove('is-paused');
        document.getElementById('trackThumb').classList.add('is-playing');
        fetchTrackTitle();
      } else if (event.data === YT.PlayerState.PAUSED) {
        btn.innerText = '▶';
        btn.classList.add('is-paused');
        document.getElementById('trackThumb').classList.remove('is-playing');
      } else if (event.data === YT.PlayerState.ENDED) {
        playNextOrRandom();
        document.getElementById('trackThumb').classList.remove('is-playing');
      }
    }   

    function onPlayerError(event) {
      console.warn(`Track ${currentIndex + 1} is unplayable. Skipping...`);
      playNextOrRandom();
    }
    
    let currentCount = Math.floor(Math.random() * (25 - 10 + 1)) + 10;

    function updateFakeListeners() {
      const countElem = document.getElementById('listenerCount');
      if (countElem) {
        countElem.innerText = `Online: ${currentCount}`;
        const delta = Math.floor(Math.random() * 5) - 2;
        currentCount = Math.max(5, currentCount + delta);
      }
    }
    updateFakeListeners();
    setInterval(updateFakeListeners, 15000);

    /* Sleep Timer Logic with Live Countdown */
    let sleepInterval = null;
    let timeRemaining = 0;

    function toggleSleepMenu() {
      const menu = document.getElementById('sleepMenu');
      menu.classList.toggle('is-open');
    }

    function setTimer(mins) {
      const btn = document.getElementById('sleepBtn');
      document.getElementById('sleepMenu').classList.remove('is-open');

      if (sleepInterval) clearInterval(sleepInterval);

      if (mins === 0) {
        timeRemaining = 0;
        btn.innerText = '🌙 Sleep timer';
        return;
      }

      timeRemaining = mins * 60;
      updateTimerDisplay();

      sleepInterval = setInterval(() => {
        timeRemaining--;

        if (timeRemaining <= 0) {
          clearInterval(sleepInterval);
          if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            ytPlayer.pauseVideo();
          }
          btn.innerText = '🌙 Sleep timer';
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const btn = document.getElementById('sleepBtn');
      const m = Math.floor(timeRemaining / 60);
      const s = String(timeRemaining % 60).padStart(2, '0');
      btn.innerText = `⏳ ${m}:${s} left`;
    }

    document.addEventListener('click', function(e) {
      const container = document.querySelector('.timer-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('sleepMenu').classList.remove('is-open');
      }
    });    
  </script>
</body>
</html>
