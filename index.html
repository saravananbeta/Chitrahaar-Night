<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chitrahaar Night</title>
  
  <!-- Cursive Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Fullscreen Background Image */
   @media (max-width: 600px) {
      .bg-image {
        object-fit: contain;
        /* Options: 'center center', 'top center', 'left center', or 'right center' */
        object-position: center center; 
      }
      
      /* ... your existing mobile styles ... */
    }

    /* Cursive Title at Top Left */
    .app-header {
      position: fixed;
      top: 25px;
      left: 35px;
      z-index: 10;
      pointer-events: none;
    }

    .app-header h1 {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-size: 3.4rem;
      font-weight: 400;
      color: #ffb703;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.8);
      line-height: 1;
    }

    /* Digital Time Display at Top Right */
    .time-display {
      position: fixed;
      top: 25px;
      right: 35px;
      z-index: 10;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    /* Minimalist Player Bar Overlay - Expanded Length */
    .player-bar {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      max-width: 90vw;
    }

    /* Thumbnail inside the player */
    .thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #ffb703;
      flex-shrink: 0;
    }

    .track-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 240px;
      overflow: hidden;
    }

    /* Small Font Real Track Title with Truncation */
    .track-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .track-sub {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.68rem;
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 2px;
    }

    /* Editable Track Input Field */
    .track-input {
      width: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      color: #ffb703;
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      padding: 0 2px;
      transition: all 0.2s ease;
    }

    .track-input:focus {
      border-color: #ffb703;
      background: rgba(0, 0, 0, 0.6);
    }

    /* Remove Spinners/Arrows from Number Input */
    .track-input::-webkit-outer-spin-button,
    .track-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .track-input[type=number] {
      -moz-appearance: textfield;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .controls button:hover {
      background: #ffb703;
      color: #000;
    }

    /* Volume Control inside Player Bar */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .volume-container input[type="range"] {
      width: 60px;
      accent-color: #ffb703;
      cursor: pointer;
    }

    /* Simple Underlined Text Link at Bottom Right Corner */
    .yt-link-text {
      position: fixed;
      bottom: 25px;
      right: 35px;
      z-index: 100;
      color: #ffb703;
      text-decoration: underline;
      font-size: 0.85rem;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      transition: color 0.2s ease;
    }

    .yt-link-text:hover {
      color: #ffffff;
    }

    /* Hidden YouTube Audio Engine */
    .audio-engine {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }
    /* Mobile Responsive Enhancements */
    @media (max-width: 600px) {
      .app-header {
        top: 15px;
        left: 20px;
      }

      .app-header h1 {
        font-size: 2.2rem;
      }

      .time-display {
        top: 20px;
        right: 20px;
        font-size: 0.85rem;
      }

      .player-bar {
        bottom: 45px;
        gap: 8px;
        padding: 6px 12px;
        max-width: 95vw;
      }

      .track-info {
        max-width: 100px; /* Prevents player from stretching beyond screen width */
      }

      .volume-container input[type="range"] {
        width: 45px; /* Compact volume slider for touch targets */
      }

      .yt-link-text {
        bottom: 12px;
        right: 50%;
        transform: translateX(50%); /* Centers link below the player on mobile */
        font-size: 0.75rem;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Background Image -->
  <img src="chitrahaar-night-background.jpg" alt="Background" class="bg-image" />

  <!-- Cursive Title at Top Left -->
  <header class="app-header">
    <h1>Chitrahaar Night</h1>
  </header>

  <!-- Digital Time Display at Top Right -->
  <div id="clockDisplay" class="time-display">00:00</div>

  <!-- Minimalist Radio Player (Centered at Bottom) -->
  <div class="player-bar">
    <img id="trackThumb" src="" alt="Thumb" class="thumb" />
    
    <div class="track-info">
      <span id="trackTitle" class="track-title" title="Track Title">Loading Title...</span>
      <div class="track-sub">
        <input 
          type="number" 
          id="trackInput" 
          class="track-input" 
          min="1" 
          max="118" 
          value="1" 
          onchange="jumpToTrack(this.value)"
          onkeydown="if(event.key==='Enter') this.blur()"
        />
        <span>/118</span>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevTrack()" title="Previous">⏮</button>
      <button id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
      <button onclick="nextTrack()" title="Next">⏭</button>
    </div>

    <div class="volume-container">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)" />
    </div>
  </div>

  <!-- Underlined Text Link at Bottom Right Corner -->
  <a href="https://www.youtube.com/playlist?list=PLLounUW9rgqGDmPxbZBerszf0dBq_M93b" target="_blank" class="yt-link-text" rel="noopener noreferrer">Listen on YouTube</a>

  <!-- Offscreen YouTube Iframe Engine for Audio Only -->
  <div id="player" class="audio-engine"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* Digital Clock Logic */
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockDisplay').innerText = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* Playlist Data & Audio Logic */
    const playlist = [
      "KleNYs1Y2I0", "BOLYNw3x1lE", "0AwkZihdw6E", "Lx26NZQleQY", "CkHw1q7blWQ", "UgWCnTwSGTg", "0xnp8z2236w", "YWoXm6V5v-A",
      "nFC7YqKnoKE", "MINo9f1hpz8", "q7iZe8GY8jw", "kf0hRxggFbA", "OJxoJxfSti0", "Zfsmj5zpZ9w", "_9lKgL2ISaY", "3DXeR51OvYg",
      "-f2wNmTi08c", "ScrOw2UfTJQ", "yYWQbyag7SM", "FIj10mJsgQQ", "BzxcAY4c_R4", "m6PmNval9Q8", "k0NnzaKaHOw", "1CDtCROJ3qU",
      "20tQCoNVJTE", "h3yQJZagDTw", "AmQHiMk_Qxw", "zG3hw-xkrow", "7ncsLuDynlk", "iOIuZiBltzU", "ehDDcBzIp5w",
      "Oq6q4HPBc5Q", "CPfiqyl-3_4", "cTvUrpSr9ck", "Y3X8MuobByU", "QCAL-wNyG0A", "MgUi_6UxJFk", "cZH5pnfn1vY", "mhAwMAfmzQQ",
      "ibikPYmtpLw", "ZUdJQSUcK_Y", "xY2P6IAd0MI", "udiDx_OahDo", "PSn9mLj1Z7k", "ilDBlVtupGE", "eQ6SCo2luTs", "9Eg4d56rt-U",
      "tvnXH83qn0Q", "ZK0b6481Bhk", "KgPoWxY1Fis", "rOuYZqomAV0", "RmWX6BYYjD0", "V2JR5qMuTVM", "8BiIHtXZ234", "p4H3YvKs-OU",
      "Mck78aR0wq0", "_SnViWuAU7E", "ZtbHrN8GBhg", "UrApX2yMOnY", "PF-JOx0HIN0", "hxjPGPLoMZQ", "cS6FEpc0z3E", "19-4KLfaLCc",
      "meif1oIfJ5o", "yVImQoGNdTE", "z3MciUpfYao", "ra4qKFmDFVg", "kGDUpxeZZMg", "NWCG3MUDc0A", "PhkADyPektU", "6db52BxXxfQ",
      "uUjeJdaliK4", "f2cUaOLsLQU", "32tNhs2Vk8U", "EBKjZaarSl0", "_SAdpFmk3l4", "3A5xez59mrg", "rHsdArEuHvQ", "Cmpzci-zYFU",
      "YXrqPqDpbjg", "DrAHWIBAiVE", "yXbSZFNBvvE", "YCuhzjK11iA", "zuxaLoz2kLg", "Nqmp8-iD_As", "9dcBy2uXL7E", "dDO9ZRSNB9s",
      "YJWR_MVFigs", "29W5zv1VlJM", "X5XztxGzNko", "qrNbG2W6IRE", "ycouT7JuZhs", "E1XJkGD-eng", "x9O4_C1evRg", "pAv48xBN2IQ",
      "ErmowyGS_YE", "bzTBf-l3RQs", "dodq6nT0k4M", "S-z2NTNqZx4", "QgYf6Z9sVQw", "2FfI2vcFB0g", "ftHwrKS2kYI", "RLYy0csJ5vI",
      "_WQCvtLTsfg", "i5AdRtJNbpM", "DKsmjyMTgBo", "f1Nhozddebo", "Cu2zpXIBWKI", "oYOaMwxlGCM", "VMdpoJoaJ9o", "zQ16T8V-Nsw",
      "F9yWACZWm8s", "Of-V8ADNVdQ", "pW5bH9-t6JE", "D41sf9G1qRk", "2Nh-snz-Llg", "k82SZZaarSl0", "cIBP6cH5AMU"
    ];

    let currentIndex = 0;
    let ytPlayer;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '1',
        width: '1',
        videoId: playlist[currentIndex],
        playerVars: { 
          'autoplay': 0, 
          'controls': 0,
          'playsinline': 1
        },
        events: {
          'onReady': updateUI,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function updateUI() {
      const id = playlist[currentIndex];
      document.getElementById('trackThumb').src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
      document.getElementById('trackInput').value = currentIndex + 1;
      
      // Temporary title until YouTube returns actual title
      fetchTrackTitle();
    }

    function fetchTrackTitle() {
      if (ytPlayer && ytPlayer.getVideoData) {
        const title = ytPlayer.getVideoData().title;
        if (title) {
          document.getElementById('trackTitle').innerText = title;
          document.getElementById('trackTitle').title = title;
          return;
        }
      }
      document.getElementById('trackTitle').innerText = `Track ${currentIndex + 1}`;
    }

    function jumpToTrack(val) {
      let num = parseInt(val, 10);
      if (isNaN(num)) return;

      if (num < 1) num = 1;
      if (num > playlist.length) num = playlist.length;

      currentIndex = num - 1;
      loadCurrentTrack();
    }

    function togglePlay() {
      if (!ytPlayer) return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function nextTrack() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadCurrentTrack();
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadCurrentTrack();
    }

    function loadCurrentTrack() {
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(playlist[currentIndex]);
      }
      updateUI();
    }

    function setVolume(val) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
    }

    function onPlayerStateChange(event) {
      const btn = document.getElementById('playBtn');
      if (event.data === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸';
        fetchTrackTitle();
      } else if (event.data === YT.PlayerState.PAUSED) {
        btn.innerText = '▶';
      } else if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    function onPlayerError(event) {
      console.warn(`Track ${currentIndex + 1} is unplayable. Skipping...`);
      nextTrack();
    }
  </script>
</body>
</html>
