<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chitrahaar Night</title>
  
  <!-- Google Fonts for Cursive Header -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Canvas */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Universal Uncropped Background Image */
    .bg-image {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain !important;
      z-index: 1;
      pointer-events: none;
    }

    /* Top Left Header */
    .app-header {
      position: fixed;
      top: 25px;
      left: 35px;
      z-index: 10;
    }

    .app-header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #ffb703;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* Top Right Clock */
    .time-display {
      position: fixed;
      top: 30px;
      right: 35px;
      z-index: 10;
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.8);
    }

    /* Floating Glassmorphic Player Bar */
    .player-bar {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 28px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    /* Thumbnail Box */
    .track-thumb {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffb703;
    }

    /* Track Information & Song Index Input */
    .track-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-info {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
    }

    .track-nav-input {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: #b0b0b0;
    }

    .track-nav-input input {
      width: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #ffb703;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    /* Playback Controls */
    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .control-btn:hover {
      color: #ffb703;
      transform: scale(1.1);
    }

    .play-pause-btn {
      background: #ffb703;
      color: #000000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1rem;
    }

    .play-pause-btn:hover {
      background: #ffa000;
      color: #000000;
    }

    /* Volume Control */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-container input[type="range"] {
      width: 70px;
      accent-color: #ffb703;
      cursor: pointer;
    }

    /* YouTube Direct Link */
    .yt-link-text {
      position: fixed;
      bottom: 12px;
      right: 35px;
      z-index: 10;
      font-size: 0.8rem;
      color: #ffb703;
      text-decoration: underline;
      cursor: pointer;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      transition: color 0.2s ease;
    }

    .yt-link-text:hover {
      color: #ffffff;
    }

    /* Hidden YouTube Player Iframe */
    #youtube-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }

    /* Mobile Responsive Overrides */
    @media (max-width: 600px) {
      .app-header {
        top: 15px;
        left: 20px;
      }

      .app-header h1 {
        font-size: 2.2rem;
      }

      .time-display {
        top: 20px;
        right: 20px;
        font-size: 0.85rem;
      }

      .player-bar {
        bottom: 45px;
        gap: 8px;
        padding: 6px 12px;
        max-width: 95vw;
      }

      .track-info {
        max-width: 100px;
        font-size: 0.8rem;
      }

      .volume-container input[type="range"] {
        width: 45px;
      }

      .yt-link-text {
        bottom: 12px;
        right: 50%;
        transform: translateX(50%);
        font-size: 0.75rem;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Responsive Background Image -->
  <img src="chitrahaar-night-background.jpg" class="bg-image" alt="Chitrahaar Night Background">

  <!-- Application Header -->
  <header class="app-header">
    <h1>Chitrahaar Night</h1>
  </header>

  <!-- Live Clock Display -->
  <div class="time-display" id="clock">00:00</div>

  <!-- Player Interface -->
  <div class="player-bar">
    <img id="track-thumbnail" class="track-thumb" src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Thumbnail">
    
    <div class="track-details">
      <div class="track-info" id="track-title">Loading Title...</div>
      <div class="track-nav-input">
        <input type="number" id="track-index-input" value="1" min="1">
        <span id="total-tracks-count">/118</span>
      </div>
    </div>

    <button class="control-btn" id="prev-btn" title="Previous Track">&#9198;</button>
    <button class="control-btn play-pause-btn" id="play-btn" title="Play/Pause">&#9654;</button>
    <button class="control-btn" id="next-btn" title="Next Track">&#9197;</button>

    <div class="volume-container">
      <span style="font-size: 0.8rem;">&#128066;</span>
      <input type="range" id="volume-slider" min="0" max="100" value="80">
    </div>
  </div>

  <!-- External Link -->
  <a id="yt-external-link" href="#" target="_blank" rel="noopener noreferrer" class="yt-link-text">Listen on YouTube</a>

  <!-- Hidden YouTube Player Container -->
  <div id="youtube-player"></div>

  <!-- Application Logic -->
  <script>
    // Playlist Video Data (118 Songs)
    const playlist = [
      { id: "dQw4w9WgXcQ", title: "Tum Saath Ho Jab Apne (From \"Kaalia\")" },
      { id: "L_LUpnjgPso", title: "Aane Wala Pal Jane Wala Hai" },
      { id: "gYT38fB_aLw", title: "Pal Pal Dil Ke Pas" }
      // Add your remaining YouTube video objects here...
    ];

    let currentTrackIndex = 0;
    let player = null;
    let isPlaying = false;

    // Element References
    const trackTitle = document.getElementById('track-title');
    const trackThumb = document.getElementById('track-thumbnail');
    const indexInput = document.getElementById('track-index-input');
    const totalCount = document.getElementById('total-tracks-count');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const ytExternalLink = document.getElementById('yt-external-link');
    const clockDisplay = document.getElementById('clock');

    // Real-time Clock Initialization
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      clockDisplay.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // YouTube Iframe API Loader
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        videoId: playlist[currentTrackIndex].id,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      player.setVolume(volumeSlider.value);
      totalCount.textContent = `/${playlist.length}`;
      loadTrack(currentTrackIndex, false);
    }

    function loadTrack(index, autoPlay = true) {
      if (index < 0) index = playlist.length - 1;
      if (index >= playlist.length) index = 0;
      
      currentTrackIndex = index;
      const track = playlist[currentTrackIndex];

      trackTitle.textContent = track.title;
      trackThumb.src = `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;
      indexInput.value = currentTrackIndex + 1;
      ytExternalLink.href = `https://www.youtube.com/watch?v=${track.id}`;

      if (player && player.loadVideoById) {
        if (autoPlay) {
          player.loadVideoById(track.id);
          isPlaying = true;
          playBtn.innerHTML = '&#10074;&#10074;';
        } else {
          player.cueVideoById(track.id);
        }
      }
    }

    function onPlayerStateChange(event) {
      // Auto-advance when song ends
      if (event.data === YT.PlayerState.ENDED) {
        loadTrack(currentTrackIndex + 1, true);
      }
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.innerHTML = '&#10074;&#10074;';
      }
      if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        playBtn.innerHTML = '&#9654;';
      }
    }

    // Auto-skip broken/unplayable videos
    function onPlayerError(event) {
      console.warn(`Video unplayable (${playlist[currentTrackIndex].id}). Skipping...`);
      loadTrack(currentTrackIndex + 1, true);
    }

    // Controls Event Handlers
    playBtn.addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    prevBtn.addEventListener('click', () => loadTrack(currentTrackIndex - 1, true));
    nextBtn.addEventListener('click', () => loadTrack(currentTrackIndex + 1, true));

    volumeSlider.addEventListener('input', (e) => {
      if (player && player.setVolume) {
        player.setVolume(e.target.value);
      }
    });

    indexInput.addEventListener('change', (e) => {
      let val = parseInt(e.target.value, 10);
      if (isNaN(val) || val < 1) val = 1;
      if (val > playlist.length) val = playlist.length;
      loadTrack(val - 1, true);
    });
  </script>
</body>
</html>
